name: build

# Builds the app for the simulator on every push, so a change that does not
# compile is caught here rather than the next time someone opens Xcode.

# The screenshots below are pushed to the ci-screens branch, which needs
# write access to the repository's contents.
permissions:
  contents: write

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The snapshot bundled into the build is checked first, on the same
      # principle as the website's own validate step: bad data never ships.
      - name: Validate the bundled snapshot
        run: node Tools/validate-seed.mjs

      # The discount pass's code must be the website's to the letter, or a
      # waiter's scan comes back red. PassCode.swift is compiled on its own
      # beside a check that holds it to codes the website's algorithm made.
      - name: Check the pass code against the website's
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp Tools/PassCodeCheck.swift "$tmp/main.swift"
          xcrun swiftc -sdk "$(xcrun --show-sdk-path --sdk macosx)" TallinnTasteBuds/Core/PassCode.swift "$tmp/main.swift" -o "$tmp/check"
          "$tmp/check"

      - name: Show the selected Xcode
        run: xcodebuild -version

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          build=(xcodebuild build
            -project TallinnTasteBuds.xcodeproj
            -scheme TallinnTasteBuds
            -destination 'generic/platform=iOS Simulator'
            -configuration Debug
            -derivedDataPath build
            CODE_SIGNING_ALLOWED=NO)
          # xcbeautify ships with the runner image, but the build must not fail
          # merely because a future image drops it.
          if command -v xcbeautify >/dev/null 2>&1; then
            "${build[@]}" | xcbeautify --renderer github-actions
          else
            "${build[@]}"
          fi

      - name: Check the generated Info.plist
        shell: bash
        run: |
          set -euo pipefail
          plist=build/Build/Products/Debug-iphonesimulator/TallinnTasteBuds.app/Info.plist
          echo "--- Info.plist ---"
          plutil -p "$plist"

          fail=0
          check() {
            if plutil -p "$plist" | grep -q "$2"; then
              echo "ok: $1"
            else
              echo "::error::$1 is missing from the built Info.plist"
              fail=1
            fi
          }
          check "location purpose string" '"NSLocationWhenInUseUsageDescription"'
          check "display name"            '"CFBundleDisplayName" => "Tallinn Taste Buds"'
          check "encryption answer"       '"ITSAppUsesNonExemptEncryption"'
          exit $fail

      # Nobody can look at a simulator from a cloud session, so the app is
      # launched here on the screens worth seeing and each one photographed.
      # LaunchScript.swift reads the arguments. The pictures are the run's
      # "screens" artifact; nothing about them can fail the build except the
      # simulator itself not starting.
      - name: Photograph the screens
        shell: bash
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/TallinnTasteBuds.app
          bundle=ee.tallinntastebuds.app
          dev=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          plain = [x for x in phones if x["name"] in ("iPhone 16", "iPhone 15")]
          print((plain or phones)[0]["udid"])')
          xcrun simctl boot "$dev"
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$dev" "$app"
          xcrun simctl privacy "$dev" grant location "$bundle"
          xcrun simctl location "$dev" set 59.4372,24.7450
          mkdir -p screens
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$dev" "$bundle" >/dev/null 2>&1 || true
            xcrun simctl launch "$dev" "$bundle" "$@" >/dev/null
            sleep 14
            xcrun simctl io "$dev" screenshot "screens/$name.png" >/dev/null
            echo "photographed $name"
          }
          shot 01-map
          shot 02-map-pressed -ttbSelect badam
          shot 03-place -ttbOpen place:badam
          shot 04-lists -ttbTab 1
          shot 05-list -ttbTab 1 -ttbOpen list:top-bars-hxzz7m
          shot 06-list-map -ttbTab 1 -ttbOpen list:top-bars-hxzz7m -ttbListMap YES
          shot 07-venue -ttbTab 1 -ttbOpen list:top-bars-hxzz7m,place:koht
          shot 08-profile -ttbTab 1 -ttbOpen profile:tallinntastebuds
          shot 09-saved -ttbTab 2 -saved-places '("badam","koht","pudel")'
          shot 10-me -ttbTab 3
          shot 11-sign-in -ttbTab 3 -ttbSheet signin
          shot 12-editor -ttbTab 1 -ttbOpen list:top-bars-hxzz7m -ttbEdit top-bars-hxzz7m
          shot 13-discount-chip -ttbSelect badam -ttbType discount
          shot 14-place-discount -ttbOpen place:magussoolane
          shot 15-pass-signed-out -ttbPass pudel
          shot 16-pass -ttbPass pudel -ttbPassPreview YES
          shot 17-discounts -ttbTab 3 -ttbOpen screen:discounts
          shot 18-locate-button -ttbSelect badam
          shot 19-list-on-a-place -ttbTab 1 -ttbOpen list:top-bars-hxzz7m -ttbListMap YES -ttbListFocus koht
          shot 20-route-walk -ttbRoute badam -routeMode foot
          shot 21-route-bus -ttbRoute badam -routeMode bus
          shot 22-route-car -ttbRoute badam -routeMode car
          shot 23-search-suggestions -ttbQuery pizza -ttbTyping YES
          shot 24-search-results -ttbQuery pizza
          # The app's own strings in another language, and the three styles
          # that are not the one every picture above is drawn in. `-lang` and
          # `-style` are the keys the app keeps those two choices under.
          shot 25-map-az -lang az
          shot 26-me-az -ttbTab 3 -lang az
          shot 27-editor-az -ttbTab 1 -ttbOpen list:top-bars-hxzz7m -ttbEdit top-bars-hxzz7m -lang az
          shot 28-me-plum -ttbTab 3 -style plum
          shot 29-map-green -ttbSelect badam -style green
          shot 30-lists-blue -ttbTab 1 -style blue
          shot 31-place-plum -ttbOpen place:badam -style plum
          shot 32-pass-green -ttbPass pudel -ttbPassPreview YES -style green
          shot 33-sign-in-doors -ttbTab 3 -ttbSheet signin -ttbDoors YES
          shot 34-sign-in-doors-plum -ttbTab 3 -ttbSheet signin -ttbDoors YES -style plum

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens
          if-no-files-found: ignore

      # The same pictures, shrunk, on a branch of their own, because a git
      # fetch reaches a cloud session where an artifact download does not.
      # One orphan commit, force-pushed over the last, so the branch never
      # grows; it carries the screens of whichever branch pushed last.
      - name: Publish the screens to the ci-screens branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for f in screens/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "$out/$(basename "${f%.png}").jpg" >/dev/null
          done
          echo "${GITHUB_REF_NAME} @ ${GITHUB_SHA}" > "$out/FROM.txt"
          cd "$out"
          git init -q -b ci-screens
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Screens of ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
